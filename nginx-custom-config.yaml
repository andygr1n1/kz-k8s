apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-custom-config
  namespace: ingress
data:
  use-http2: "true"
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
  server-snippet: |
    listen 30400 ssl http2;
    ssl_certificate /etc/ingress-controller/ssl/kz-node-tls.crt;
    ssl_certificate_key /etc/ingress-controller/ssl/kz-node-tls.key;