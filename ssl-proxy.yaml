apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ssl-proxy-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    stream {
        upstream backend_http {
            server kz-node-direct.default.svc.cluster.local:80;
        }
        
        upstream backend_https {
            server 127.0.0.1:8443;
        }
        
        map $ssl_preread_protocol $upstream {
            "" backend_http;
            "TLSv1.2" backend_https;
            "TLSv1.3" backend_https;
            default backend_http;
        }
        
        server {
            listen 30400;
            ssl_preread on;
            proxy_pass $upstream;
        }
    }
    
    http {
        upstream backend {
            server kz-node-direct.default.svc.cluster.local:80;
        }
        
        # HTTPS termination on internal port
        server {
            listen 8443 ssl;
            server_name srv642680.hstgr.cloud;
            
            ssl_certificate /etc/ssl/certs/tls.crt;
            ssl_certificate_key /etc/ssl/certs/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;
            
            location / {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssl-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssl-proxy
  template:
    metadata:
      labels:
        app: ssl-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 30400
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-ssl-proxy-config
      - name: ssl-certs
        secret:
          secretName: kz-backend-tls-temp
---
apiVersion: v1
kind: Service
metadata:
  name: ssl-proxy
spec:
  type: NodePort
  ports:
  - port: 443
    targetPort: 30400
    nodePort: 30402
  selector:
    app: ssl-proxy